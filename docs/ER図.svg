<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .table-title { font: 700 24px 'Helvetica', 'Arial', sans-serif; fill: #111827; }
      .table-text { font: 18px 'Helvetica', 'Arial', sans-serif; fill: #1f2937; }
      .label { font: 700 18px 'Helvetica', 'Arial', sans-serif; fill: #374151; }
      .line { stroke: #374151; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />

  <text x="80" y="60" class="table-title">勤怠管理アプリ ER図</text>

  <rect x="80" y="120" width="280" height="250" rx="4" fill="#f8f9fa" stroke="#111827" stroke-width="3" />
  <line x1="80" y1="165" x2="360" y2="165" stroke="#111827" stroke-width="2" />
  <text x="100" y="150" class="table-title">users</text>
  <text x="100" y="200" class="table-text">PK id</text>
  <text x="100" y="230" class="table-text">name</text>
  <text x="100" y="260" class="table-text">email (UK)</text>
  <text x="100" y="290" class="table-text">role</text>
  <text x="100" y="320" class="table-text">email_verified_at</text>
  <text x="100" y="350" class="table-text">password</text>

  <rect x="470" y="120" width="340" height="270" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="3" />
  <line x1="470" y1="165" x2="810" y2="165" stroke="#9a3412" stroke-width="2" />
  <text x="490" y="150" class="table-title">attendances</text>
  <text x="490" y="200" class="table-text">PK id</text>
  <text x="490" y="230" class="table-text">FK user_id</text>
  <text x="490" y="260" class="table-text">work_date</text>
  <text x="490" y="290" class="table-text">clock_in_at</text>
  <text x="490" y="320" class="table-text">clock_out_at</text>
  <text x="490" y="350" class="table-text">UNIQUE(user_id, work_date)</text>

  <rect x="920" y="120" width="280" height="220" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3" />
  <line x1="920" y1="165" x2="1200" y2="165" stroke="#1d4ed8" stroke-width="2" />
  <text x="940" y="150" class="table-title">break_times</text>
  <text x="940" y="200" class="table-text">PK id</text>
  <text x="940" y="230" class="table-text">FK attendance_id</text>
  <text x="940" y="260" class="table-text">started_at</text>
  <text x="940" y="290" class="table-text">ended_at</text>
  <text x="940" y="320" class="table-text">created_at / updated_at</text>

  <rect x="470" y="520" width="370" height="280" rx="4" fill="#f5f3ff" stroke="#5b21b6" stroke-width="3" />
  <line x1="470" y1="565" x2="840" y2="565" stroke="#5b21b6" stroke-width="2" />
  <text x="490" y="550" class="table-title">attendance_requests</text>
  <text x="490" y="600" class="table-text">PK id</text>
  <text x="490" y="630" class="table-text">FK attendance_id</text>
  <text x="490" y="660" class="table-text">requested_clock_in_at</text>
  <text x="490" y="690" class="table-text">requested_clock_out_at</text>
  <text x="490" y="720" class="table-text">requested_break_times</text>
  <text x="490" y="750" class="table-text">note</text>
  <text x="490" y="780" class="table-text">status</text>

  <path d="M360 245 L470 245" class="line" marker-end="url(#arrow)" />
  <text x="390" y="230" class="label">1 : N</text>

  <path d="M810 230 L920 230" class="line" marker-end="url(#arrow)" />
  <text x="845" y="215" class="label">1 : N</text>

  <path d="M640 420 L640 520" class="line" marker-end="url(#arrow)" />
  <text x="660" y="485" class="label">1 : N</text>

  <text x="80" y="850" class="table-text">relations: users 1:N attendances, attendances 1:N break_times, attendances 1:N attendance_requests</text>
</svg>
